<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ADD8E6;
            --primary-dark: #87CEEB;
            --bg: #010204;
            --bg-surface: rgba(255,255,255,0.015);
            --border: rgba(255,255,255,0.04);
            --border-glow: rgba(173,216,230,0.15);
            --text-muted: rgba(255,255,255,0.35);
        }

        * {
            margin: 0; padding: 0; box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            height: 100%;
            background: var(--bg);
            color: #fff;
            overflow: hidden;
        }

       
        .grid-overlay {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background-image:
                linear-gradient(rgba(173,216,230,0.025) 1px, transparent 1px),
                linear-gradient(90deg, rgba(173,216,230,0.025) 1px, transparent 1px);
            background-size: 60px 60px;
            mask-image: radial-gradient(ellipse 80% 60% at 50% 50%, black 30%, transparent 100%);
        }


        .bg-radial {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background: radial-gradient(circle at 50% 40%, rgba(173,216,230,0.04) 0%, transparent 65%);
        }

 
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            pointer-events: none;
            z-index: 0;
            animation: orbPulse 14s ease-in-out infinite alternate;
        }
        .orb-1 {
            width: 55vw; height: 55vw;
            background: radial-gradient(circle, #ADD8E6 0%, transparent 70%);
            opacity: 0.055;
            top: -28vw; left: -28vw;
            animation-delay: 0s;
        }
        .orb-2 {
            width: 45vw; height: 45vw;
            background: radial-gradient(circle, #4682B4 0%, transparent 70%);
            opacity: 0.04;
            bottom: -22vw; right: -22vw;
            animation-delay: -7s;
        }
        .orb-3 {
            width: 30vw; height: 30vw;
            background: radial-gradient(circle, #ADD8E6 0%, transparent 70%);
            opacity: 0.03;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -3.5s;
        }

        @keyframes orbPulse {
            0%   { transform: scale(1); opacity: var(--o, 0.055); }
            100% { transform: scale(1.12); opacity: calc(var(--o, 0.055) * 1.6); }
        }

     
        .scanlines {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 1;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.08) 2px,
                rgba(0,0,0,0.08) 4px
            );
            opacity: 0.4;
        }

        
        .page {
            position: relative;
            z-index: 10;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }

        
        .error-code-wrap {
            position: relative;
            margin-bottom: 2.5rem;
            display: inline-block;
        }

        .error-code {
            font-size: clamp(7rem, 22vw, 18rem);
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 0.85;
            color: transparent;
            -webkit-text-stroke: 1px rgba(173,216,230,0.12);
            position: relative;
            user-select: none;
            animation: fadeInDown 1s cubic-bezier(0.16,1,0.3,1) forwards;
            opacity: 0;
        }

       
        .error-code-inner {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(7rem, 22vw, 18rem);
            font-weight: 900;
            letter-spacing: -0.06em;
            line-height: 0.85;
            background: linear-gradient(135deg, rgba(255,255,255,0.9) 0%, rgba(173,216,230,0.7) 40%, rgba(255,255,255,0.2) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 0 40px rgba(173,216,230,0.15));
        }

      
        .divider {
            width: 1px;
            height: 0;
            background: linear-gradient(to bottom, transparent, rgba(173,216,230,0.3), transparent);
            margin: 0 auto 2.5rem;
            animation: growLine 1s 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
        }
        @keyframes growLine {
            to { height: 60px; }
        }

      
        .error-title {
            font-size: clamp(1.1rem, 3vw, 1.5rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            color: rgba(255,255,255,0.85);
            margin-bottom: 0.75rem;
            opacity: 0;
            animation: fadeInUp 0.8s 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
        }

        .error-sub {
            font-size: 0.9rem;
            font-weight: 400;
            color: var(--text-muted);
            max-width: 360px;
            line-height: 1.7;
            margin: 0 auto 2.5rem;
            opacity: 0;
            animation: fadeInUp 0.8s 0.75s cubic-bezier(0.16,1,0.3,1) forwards;
        }



        
        .btn-row {
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            justify-content: center;
            opacity: 0;
            animation: fadeInUp 0.8s 1.05s cubic-bezier(0.16,1,0.3,1) forwards;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            border: 1px solid transparent;
        }

        .btn-primary {
            background: var(--primary);
            color: #010204;
            border-color: transparent;
            box-shadow: 0 0 24px rgba(173,216,230,0.2);
        }
        .btn-primary:hover {
            background: #fff;
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 8px 30px rgba(173,216,230,0.3);
        }

        .btn-ghost {
            background: rgba(255,255,255,0.03);
            color: rgba(255,255,255,0.6);
            border-color: rgba(255,255,255,0.07);
        }
        .btn-ghost:hover {
            background: rgba(255,255,255,0.07);
            color: #fff;
            border-color: rgba(173,216,230,0.2);
            transform: translateY(-2px);
        }

        
        .powered-by {
            position: fixed;
            bottom: 1.75rem;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 20;
            gap: 0.55rem;
            font-size: 0.72rem;
            font-weight: 500;
            color: rgba(255,255,255,0.22);
            letter-spacing: 0.02em;
            white-space: nowrap;
            opacity: 0;
            animation: fadeInUp 1s 1.3s cubic-bezier(0.16,1,0.3,1) forwards;
            user-select: none;
        }

        .powered-by::before,
        .powered-by::after {
            content: '';
            display: block;
            width: 30px;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.12));
        }
        .powered-by::after {
            background: linear-gradient(to left, transparent, rgba(255,255,255,0.12));
        }

        .powered-by span.proxy {
            color: rgba(173,216,230,0.45);
            font-weight: 600;
        }

        
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to   { opacity: 1; transform: translateY(0); }
        }

    </style>
</head>
<body>

    
    <div class="bg-radial"></div>
    <div class="grid-overlay"></div>
    <div class="orb orb-1" style="--o:0.055;"></div>
    <div class="orb orb-2" style="--o:0.04;"></div>
    <div class="orb orb-3" style="--o:0.03;"></div>
    <div class="scanlines"></div>

    
    <div class="page">
        <div class="error-code-wrap">
            <div class="error-code" aria-hidden="true">401</div>
            <div class="error-code-inner">401</div>
        </div>

        <div class="divider"></div>

        <h1 class="error-title">Unauthorized</h1>
        <p class="error-sub">You lack valid authentication credentials for the requested resource. Please sign in and try again.</p>

        <div class="btn-row">
            <a href="javascript:history.back()" class="btn btn-ghost">
                <i class="fas fa-arrow-left" style="font-size:0.8rem;"></i>
                Go Back
            </a>
        </div>
    </div>


    <div class="powered-by">
        <span>this website proxied by</span>
        <span class="proxy">dasiiproxy v2.0</span>
    </div>

</body>
</html>
